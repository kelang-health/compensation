<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ระบบค่าตอบแทน</title><style>body{font-family:system-ui,'Sarabun';background:#f3f7f5;color:#173b2b;margin:0}main{max-width:850px;margin:36px auto;padding:20px}.card{background:#fff;padding:24px;border-radius:14px;box-shadow:0 2px 14px #0002}input,button{box-sizing:border-box;width:100%;padding:11px;margin:6px 0;border-radius:7px;border:1px solid #c7d8cf}button{background:#23734e;color:#fff;border:0;font-weight:bold}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #e5ece8;text-align:left}</style></head><body><main id="app"></main><script>const API='https://compensation-api.mithong3.workers.dev',app=document.getElementById('app');let token=sessionStorage.getItem('comp_token')||'';async function request(path,method='GET',body){const r=await fetch(API+path,{method,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined}),raw=await r.text();let j;try{j=JSON.parse(raw)}catch(_){throw Error('API HTTP '+r.status+': '+raw.slice(0,180))}if(j.ok===true)return j.data;if(j.token||Array.isArray(j.items))return j;throw Error(j.message||j.error||('Backend response: '+JSON.stringify(j).slice(0,300)))}function loginView(){app.innerHTML='<section class="card"><h1>ระบบจัดการค่าตอบแทน</h1><input id="u" autocomplete="username" placeholder="ชื่อผู้ใช้"><input id="p" type="password" autocomplete="current-password" placeholder="รหัสผ่าน"><button onclick="login()">เข้าสู่ระบบ</button></section>'}async function login(){try{const x=await request('/v1/auth/login','POST',{username:u.value,password:p.value});token=x.token;sessionStorage.setItem('comp_token',token);dashboard()}catch(e){alert(e.message)}}async function dashboard(){try{const x=await request('/v1/claims');app.innerHTML='<section class="card"><button onclick="logout()">ออกจากระบบ</button><h1>รายการคำขอเบิก</h1><table><tr><th>เลขคำขอ</th><th>ปี/เดือน</th><th>จำนวนเงิน</th><th>สถานะ</th></tr>'+x.items.map(v=>'<tr><td>'+esc(v.claimId)+'</td><td>'+esc(v.fiscalYear)+'</td><td>'+esc(v.month)+'</td><td>'+Number(v.amount).toLocaleString('th-TH')+'</td><td>'+esc(v.status)+'</td></tr>').join('')+'</table></section>'}catch(e){alert(e.message);logout()}}function logout(){sessionStorage.removeItem('comp_token');token='';loginView()}function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}token?dashboard():loginView();</script></body></html>
