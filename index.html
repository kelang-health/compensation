<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ระบบค่าตอบแทน</title><style>body{font-family:system-ui,'Sarabun';margin:0;background:#f4f8f6;color:#183b2b}#app{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;padding:18px;border-radius:14px;box-shadow:0 2px 12px #0001;margin:12px 0}nav{background:#247b55;color:#fff;padding:14px;border-radius:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}nav button{width:auto;background:#fff2;color:#fff;border:1px solid #fff5}.right{margin-left:auto}input,select,textarea,button{box-sizing:border-box;padding:10px;margin:5px 0;border-radius:7px;border:1px solid #c9d8d0;font:inherit}button{background:#247b55;color:#fff;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.kpi{font-size:26px;font-weight:bold}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5ece8;text-align:left}.muted{color:#667}@media print{nav,.no-print{display:none}.card{box-shadow:none}}</style></head><body><div id="app"></div><script>const API='https://compensation-api.mithong3.workers.dev',app=document.getElementById('app');let token=sessionStorage.getItem('comp_token')||'',state={};async function api(path,method='GET',body){const r=await fetch(API+path,{method,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined}),t=await r.text();let j;try{j=JSON.parse(t)}catch(_){throw Error('API '+r.status)}if(j.error)throw Error(j.message||'เกิดข้อผิดพลาด');return j.ok===true?j.data:j}const esc=x=>{const d=document.createElement('div');d.textContent=x??'';return d.innerHTML};function loginView(){app.innerHTML='<div class="card" style="max-width:420px;margin:80px auto"><h1>ระบบจัดการค่าตอบแทน</h1><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">เข้าสู่ระบบ</button></div>'}async function login(){try{const x=await api('/v1/auth/login','POST',{username:u.value,password:p.value});token=x.token;sessionStorage.setItem('comp_token',token);home()}catch(e){alert(e.message)}}function nav(){return '<nav><b>💼 ระบบค่าตอบแทน</b><button onclick="home()">Dashboard</button><button onclick="claims()">คำขอเบิก</button><button onclick="people()">บุคลากร</button><button onclick="monthly()">ฉ.11 รายเดือน</button><button class="right" onclick="logout()">ออกจากระบบ</button></nav>'}async function home(){try{const x=await api('/v1/dashboard');state.dashboard=x;app.innerHTML=nav()+'<div class="grid">'+[['คำขอทั้งหมด',x.counts.claims],['ร่าง',x.counts.draft],['รออนุมัติ',x.counts.pending],['อนุมัติ',x.counts.approved]].map(k=>'<div class="card"><div class="muted">'+k[0]+'</div><div class="kpi">'+k[1]+'</div></div>').join('')+'</div><div class="card"><h2>รายการล่าสุด</h2>'+claimTable(x.items)+'</div>'}catch(e){alert(e.message);logout()}}function claimTable(a){return '<table><tr><th>เลขคำขอ</th><th>ปี/เดือน</th><th>ประเภท</th><th>จำนวนเงิน</th><th>สถานะ</th><th></th></tr>'+a.map(x=>'<tr><td>'+esc(x.claimId)+'</td><td>'+esc(x.fiscalYear)+' / '+esc(x.month)+'</td><td>'+esc(x.type)+'</td><td>'+Number(x.amount).toLocaleString()+'</td><td>'+esc(x.status)+'</td><td><button onclick="detail(\''+x.claimId+'\')">ดู/พิมพ์</button></td></tr>').join('')+'</table>'}async function claims(){const x=await api('/v1/claims');app.innerHTML=nav()+'<div class="card"><button class="no-print" onclick="claimForm()">+ สร้างคำขอเบิก</button><h2>คำขอเบิก</h2>'+claimTable(x.items)+'</div>'}async function people(){const x=await api('/v1/people');app.innerHTML=nav()+'<div class="card"><button onclick="personForm()">+ เพิ่มบุคลากร</button><h2>บุคลากร</h2><table><tr><th>รหัส</th><th>ชื่อ-สกุล</th><th>ตำแหน่ง</th><th>ระดับ</th><th>หน่วยบริการ</th></tr>'+x.items.map(p=>'<tr><td>'+esc(p.id)+'</td><td>'+esc(p.name)+'</td><td>'+esc(p.position)+'</td><td>'+esc(p.level)+'</td><td>'+esc(p.unit)+'</td></tr>').join('')+'</table></div>'}async function personForm(){app.innerHTML=nav()+'<div class="card"><h2>เพิ่มบุคลากร</h2><input id="pt" placeholder="คำนำหน้า"><input id="pf" placeholder="ชื่อ"><input id="pl" placeholder="นามสกุล"><input id="pp" placeholder="ตำแหน่ง"><input id="pv" placeholder="ระดับ"><input id="pu" placeholder="หน่วยบริการ"><button onclick="savePerson()">บันทึก</button></div>'}async function savePerson(){try{await api('/v1/people','POST',{title:pt.value,firstName:pf.value,lastName:pl.value,position:pp.value,level:pv.value,unit:pu.value});people()}catch(e){alert(e.message)}}async function claimForm(){const x=await api('/v1/people');app.innerHTML=nav()+'<div class="card"><h2>สร้างคำขอเบิก</h2><select id="cp">'+x.items.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' — '+esc(p.position)+'</option>').join('')+'</select><input id="cfy" value="2570" placeholder="ปีงบประมาณ"><input id="cm" value="ทั้งปี" placeholder="เดือน/รอบ"><input id="ct" placeholder="ประเภทค่าตอบแทน"><input id="cr" type="number" placeholder="อัตราต่อเดือน"><input id="cn" type="number" value="12" min="1" placeholder="จำนวนเดือน"><textarea id="cno" placeholder="หมายเหตุ"></textarea><button onclick="saveClaim()">สร้างคำขอ</button></div>'}async function saveClaim(){try{await api('/v1/claims','POST',{personId:cp.value,fiscalYear:cfy.value,month:cm.value,type:ct.value,rate:cr.value,months:cn.value,note:cno.value});claims()}catch(e){alert(e.message)}}async function monthly(){const x=await api('/v1/monthly');app.innerHTML=nav()+'<div class="card"><h2>ฉ.11 รายเดือน</h2><table><tr><th>เลขที่</th><th>บุคลากร</th><th>ปี/เดือน</th><th>เงิน</th><th>สถานะ</th></tr>'+x.items.map(v=>'<tr><td>'+esc(v.id)+'</td><td>'+esc(v.personId)+'</td><td>'+esc(v.fiscalYear)+'/'+esc(v.month)+'</td><td>'+Number(v.amount).toLocaleString()+'</td><td>'+esc(v.status)+'</td></tr>').join('')+'</table></div>'}async function detail(id){const x=await api('/v1/claims/'+id),c=x.claim,p=x.person,h=x.history||[];const name=[p['คำนำหน้า'],p['ชื่อ'],p['นามสกุล']].filter(Boolean).join(' '),fy=Number(c['ปีงบประมาณ']),start=c['วันที่เริ่มสิทธิ']||'',end=c['วันที่สิ้นสุดสิทธิ']||'',amount=Number(c['จำนวนเงิน']||0);app.innerHTML=nav()+'<article class="card print-form"><div class="no-print"><button onclick="window.print()">พิมพ์แบบที่ 1</button><button onclick="print11()">พิมพ์ ฉ.11</button></div><h2 style="text-align:center">แบบคำขอรับเงินค่าตอบแทนเจ้าหน้าที่ที่ปฏิบัติงานให้แก่หน่วยบริการสาธารณสุข<br>ขององค์กรปกครองส่วนท้องถิ่น</h2><p style="text-align:right">เขียนที่ '+esc(p['หน่วยบริการปัจจุบัน']||'ศูนย์บริการสาธารณสุขบ้านโทกหัวช้าง')+'<br>วันที่ '+new Date(c['วันที่ยื่น']||Date.now()).toLocaleDateString('th-TH')+'</p><p><b>เรื่อง</b> ขอรับเงินค่าตอบแทน<br><b>เรียน</b> นายกเทศมนตรีเมืองเขลางค์นคร</p><p>ข้าพเจ้า <b>'+esc(name)+'</b> ตำแหน่ง <b>'+esc(p.ตำแหน่ง)+'</b> ระดับ <b>'+esc(p.ระดับ)+'</b> สังกัด '+esc(p['สำนัก/กอง'])+' ปัจจุบันปฏิบัติงานในหน่วยบริการสาธารณสุข '+esc(p['หน่วยบริการปัจจุบัน'])+'</p><p>หมู่ที่ '+esc(p['หมู่ที่'])+' ตำบล '+esc(p.ตำบล)+' อำเภอ '+esc(p.อำเภอ)+' จังหวัด '+esc(p.จังหวัด)+' ที่อยู่ปัจจุบันบ้านเลขที่ '+esc(p['บ้านเลขที่'])+' รหัสไปรษณีย์ '+esc(p['รหัสไปรษณีย์'])+'</p><p>มีความประสงค์ขอรับเงิน <b>'+esc(c['ประเภทค่าตอบแทน'])+'</b> ตั้งแต่วันที่ '+esc(start)+' ถึงวันที่ '+esc(end)+' จำนวน '+esc(c['จำนวนเดือน'])+' เดือน ในอัตราเดือนละ '+Number(c['อัตราต่อเดือน']||0).toLocaleString('th-TH')+' บาท รวมเป็นเงิน <b>'+amount.toLocaleString('th-TH')+' บาท</b></p><p>ข้าพเจ้าขอรับรองว่าเป็นผู้มีสิทธิได้รับเงินค่าตอบแทนตามหลักเกณฑ์และอัตราที่กำหนดทุกประการ</p><p style="text-align:right;margin-top:40px">ลงชื่อ ................................................ ผู้ยื่นขอรับเงิน<br>('+esc(name)+')<br>'+esc(p.ตำแหน่ง)+'</p><hr><h3>ผลการพิจารณาของผู้บังคับบัญชาและคณะกรรมการฯ</h3><div class="grid"><p>1. ผู้บังคับบัญชาชั้นต้น<br>☐ มีสิทธิได้รับเงินค่าตอบแทน &nbsp; ☐ ไม่มีสิทธิ</p><p>2. หัวหน้าหน่วยบริการ<br>☐ เห็นชอบ &nbsp; ☐ ไม่เห็นชอบ</p><p>3. คณะกรรมการตรวจคำขอ<br>☐ มีสิทธิ &nbsp; ☐ ไม่มีสิทธิ</p><p>4. ผู้อนุมัติ<br>☐ อนุมัติ &nbsp; ☐ ไม่อนุมัติ</p></div></article>';window.print11=()=>{app.innerHTML=nav()+'<article class="card print-form"><div class="no-print"><button onclick="window.print()">พิมพ์ ฉ.11</button><button onclick="detail(\\''+id+'\\')">กลับแบบที่ 1</button></div><h2 style="text-align:center">ใบขอรับเงินค่าตอบแทนเบี้ยเลี้ยงเหมาจ่ายสำหรับเจ้าหน้าที่<br>ที่ปฏิบัติงานในหน่วยบริการ สังกัดเทศบาลเมืองเขลางค์นคร</h2><p style="text-align:center">หน่วยบริการ '+esc(p['หน่วยบริการปัจจุบัน'])+'<br>ประจำเดือน '+esc(c['เดือน'])+' พ.ศ. '+esc(c['ปีงบประมาณ'])+'</p><p>ข้าพเจ้า '+esc(p['คำนำหน้า'])+' '+esc(p['ชื่อ'])+' นามสกุล '+esc(p['นามสกุล'])+' ตำแหน่ง '+esc(p.ตำแหน่ง)+'</p><p>ปัจจุบันปฏิบัติงานที่ '+esc(p['หน่วยบริการปัจจุบัน'])+' จังหวัด '+esc(p.จังหวัด)+' ระดับ/กลุ่ม '+esc(p['กลุ่มพื้นที่'])+'</p><h3>รายละเอียดการปฏิบัติงาน</h3>'+h.map((v,i)=>'<p>'+(i+1)+'. ปฏิบัติงานที่ '+esc(v['หน่วยบริการ'])+' จังหวัด '+esc(v.จังหวัด)+' จัดระดับ '+esc(v['ระดับพื้นที่'])+' ตั้งแต่ '+esc(v['วันที่เริ่ม'])+' ถึง '+esc(v['วันที่สิ้นสุด'])+' รวม '+esc(v.ปี)+' ปี '+esc(v.เดือน)+' เดือน '+esc(v.วัน)+' วัน</p>').join('')+'<p>ข้าพเจ้าขอรับรองว่าข้อมูลดังกล่าวเป็นความจริงทุกประการ</p><p style="text-align:right;margin-top:40px">...................................<br>('+esc(name)+')<br>'+esc(p.ตำแหน่ง)+'</p></article>'}}function logout(){sessionStorage.removeItem('comp_token');token='';loginView()}token?home():loginView();</script></body></html>
