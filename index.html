<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบค่าตอบแทน</title>
<style>
body{font-family:system-ui,'Sarabun',sans-serif;margin:0;background:#f4f8f6;color:#183b2b}#app{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;padding:18px;border-radius:14px;box-shadow:0 2px 12px #0001;margin:12px 0}nav{background:#247b55;color:#fff;padding:14px;border-radius:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}nav button{width:auto;background:#fff2;color:#fff;border:1px solid #fff5}.right{margin-left:auto}input,select,textarea,button{box-sizing:border-box;padding:10px;margin:5px 0;border-radius:7px;border:1px solid #c9d8d0;font:inherit}input,select,textarea{width:100%}button{background:#247b55;color:#fff;border:0;cursor:pointer;width:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.kpi{font-size:26px;font-weight:bold}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5ece8;text-align:left}.muted{color:#667}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:10px;background:#eef8f2;border-left:4px solid #247b55}.loading{opacity:.55;pointer-events:none}@media(max-width:700px){table{display:block;overflow:auto}}
</style></head><body><div id="app"></div>
<script>
const API='https://compensation-api.mithong3.workers.dev',app=document.getElementById('app');let token=sessionStorage.getItem('comp_token')||'';
async function api(path,method='GET',body){const r=await fetch(API+path,{method,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined}),t=await r.text();let j;try{j=JSON.parse(t)}catch(_){throw Error('API HTTP '+r.status)}if(j.error)throw Error(j.message||'เกิดข้อผิดพลาด');return j.ok===true&&j.data?j.data:j}
const esc=x=>{const d=document.createElement('div');d.textContent=x??'';return d.innerHTML};
function loginView(){app.innerHTML='<div class="card" style="max-width:420px;margin:80px auto"><h1>ระบบจัดการค่าตอบแทน</h1><input id="u" autocomplete="username" placeholder="ชื่อผู้ใช้"><input id="p" type="password" autocomplete="current-password" placeholder="รหัสผ่าน"><button onclick="login()">เข้าสู่ระบบ</button></div>'}
async function login(){try{const x=await api('/v1/auth/login','POST',{username:u.value,password:p.value});token=x.token;sessionStorage.setItem('comp_token',token);home()}catch(e){alert(e.message)}}
function nav(){return '<nav><b>💼 ระบบค่าตอบแทน</b><button onclick="home()">Dashboard</button><button onclick="claims()">คำขอเบิก</button><button onclick="people()">บุคลากร</button><button onclick="monthly()">ฉ.11 รายเดือน</button><button class="right" onclick="logout()">ออกจากระบบ</button></nav>'}
async function home(){try{const x=await api('/v1/dashboard');app.innerHTML=nav()+'<div class="grid">'+[['คำขอทั้งหมด',x.counts.claims],['ร่าง',x.counts.draft],['รออนุมัติ',x.counts.pending],['อนุมัติ',x.counts.approved]].map(k=>'<div class="card"><div class="muted">'+k[0]+'</div><div class="kpi">'+k[1]+'</div></div>').join('')+'</div><div class="card"><h2>รายการล่าสุด</h2>'+claimTable(x.items)+'</div>'}catch(e){alert(e.message);logout()}}
function claimTable(a){return '<table><tr><th>เลขคำขอ</th><th>ปี/เดือน</th><th>ประเภท</th><th>จำนวนเงิน</th><th>สถานะ</th><th></th></tr>'+a.map(x=>'<tr><td>'+esc(x.claimId)+'</td><td>'+esc(x.fiscalYear)+' / '+esc(x.month)+'</td><td>'+esc(x.type)+'</td><td>'+Number(x.amount).toLocaleString('th-TH')+'</td><td>'+esc(x.status)+'</td><td><button data-id="'+esc(x.claimId)+'" onclick="detail(this.dataset.id)">ดู/พิมพ์</button></td></tr>').join('')+'</table>'}
async function claims(){try{const x=await api('/v1/claims');app.innerHTML=nav()+'<div class="card"><button onclick="claimForm()">+ สร้างคำขอเบิก</button><h2>คำขอเบิก</h2>'+claimTable(x.items)+'</div>'}catch(e){alert(e.message)}}
async function people(){try{const x=await api('/v1/people');app.innerHTML=nav()+'<div class="card"><button onclick="personForm()">+ เพิ่มบุคลากร</button><h2>บุคลากร</h2><table><tr><th>รหัส</th><th>ชื่อ-สกุล</th><th>ตำแหน่ง</th><th>ระดับ</th><th>หน่วยบริการ</th></tr>'+x.items.map(p=>'<tr><td>'+esc(p.id)+'</td><td>'+esc(p.name)+'</td><td>'+esc(p.position)+'</td><td>'+esc(p.level)+'</td><td>'+esc(p.unit)+'</td></tr>').join('')+'</table></div>'}catch(e){alert(e.message)}}
function personForm(){app.innerHTML=nav()+`<div class="card"><h2>เพิ่มบุคลากร</h2><div class="grid"><input id="pt" placeholder="คำนำหน้า"><input id="pf" placeholder="ชื่อ *"><input id="pl" placeholder="นามสกุล *"><input id="pp" placeholder="ตำแหน่ง *"><input id="pv" placeholder="ระดับ"><input id="po" placeholder="สำนัก/กอง"><input id="pu" placeholder="หน่วยบริการปัจจุบัน"><input id="ps" type="date" title="วันที่เริ่มรับราชการ"><input id="pvg" placeholder="หมู่ที่ของหน่วยบริการ"><input id="ptb" placeholder="ตำบล"><input id="pd" placeholder="อำเภอ"><input id="ppr" placeholder="จังหวัด"><input id="pa" placeholder="บ้านเลขที่"><input id="pam" placeholder="หมู่ที่ (ที่อยู่)"><input id="prd" placeholder="ถนน"><input id="pz" placeholder="รหัสไปรษณีย์"><input id="pag" placeholder="กลุ่มพื้นที่"><input id="plt" placeholder="ประเภทใบอนุญาต"><input id="pln" placeholder="เลขใบอนุญาต"><label>เริ่มปฏิบัติงานที่หน่วยนี้<input id="phs" type="date"></label><label>สิ้นสุด (เว้นว่างถ้ายังปฏิบัติงาน)<input id="phe" type="date"></label></div><button onclick="savePerson()">บันทึกบุคลากร</button></div>`}
async function savePerson(){try{await api('/v1/people','POST',{title:pt.value,firstName:pf.value,lastName:pl.value,position:pp.value,level:pv.value,office:po.value,unit:pu.value,startDate:ps.value,village:pvg.value,subdistrict:ptb.value,district:pd.value,province:ppr.value,address:pa.value,addressVillage:pam.value,road:prd.value,addressSubdistrict:ptb.value,addressDistrict:pd.value,addressProvince:ppr.value,postcode:pz.value,areaGroup:pag.value,licenseType:plt.value,licenseNo:pln.value,historyStart:phs.value,historyEnd:phe.value,historyProvince:ppr.value,historyLevel:pag.value});alert('บันทึกบุคลากรแล้ว');people()}catch(e){alert(e.message)}}
async function claimForm(){try{const x=await api('/v1/people');app.innerHTML=nav()+`<div class="card"><h2>สร้างคำขอเบิก</h2><div class="grid"><select id="cp">${x.items.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+' — '+esc(p.position)+'</option>').join('')}</select><input id="cfy" value="2570" placeholder="ปีงบประมาณ"><input id="cm" value="ทั้งปี" placeholder="เดือน/รอบ"><input id="ct" value="ค่าเบี้ยเลี้ยงเหมาจ่ายสำหรับเจ้าหน้าที่ที่ปฏิบัติงานในหน่วยบริการสาธารณสุข" placeholder="ประเภทค่าตอบแทน"><input id="cr" type="number" placeholder="อัตราต่อเดือน"><input id="cn" type="number" value="12" min="1" placeholder="จำนวนเดือน"><label>วันที่เริ่มสิทธิ<input id="cs" type="date"></label><label>วันที่สิ้นสุดสิทธิ<input id="ce" type="date"></label></div><textarea id="cno" placeholder="หมายเหตุ"></textarea><button onclick="saveClaim()">สร้างคำขอ</button></div>`}catch(e){alert(e.message)}}
async function saveClaim(){try{const x=await api('/v1/claims','POST',{personId:cp.value,fiscalYear:cfy.value,month:cm.value,type:ct.value,rate:cr.value,months:cn.value,startDate:cs.value,endDate:ce.value,note:cno.value});alert('สร้างคำขอ '+x.claimId+' แล้ว');detail(x.claimId)}catch(e){alert(e.message)}}
async function monthly(){try{const x=await api('/v1/monthly');app.innerHTML=nav()+'<div class="card"><button onclick="monthlyForm()">+ สร้างรายการ ฉ.11</button><h2>ฉ.11 รายเดือน</h2><table><tr><th>เลขที่</th><th>บุคลากร</th><th>ปี/เดือน</th><th>เงิน</th><th>สถานะ</th><th></th></tr>'+x.items.map(v=>'<tr><td>'+esc(v.id)+'</td><td>'+esc(v.personId)+'</td><td>'+esc(v.fiscalYear)+' / '+esc(v.month)+'</td><td>'+Number(v.amount).toLocaleString('th-TH')+'</td><td>'+esc(v.status)+'</td><td><button data-id="'+esc(v.id)+'" onclick="downloadPdf(\'/v1/prints/form11/\'+this.dataset.id,this)">สร้าง PDF ฉ.11</button></td></tr>').join('')+'</table></div>'}catch(e){alert(e.message)}}
async function monthlyForm(){try{const x=await api('/v1/people');app.innerHTML=nav()+`<div class="card"><h2>สร้างรายการ ฉ.11 รายเดือน</h2><div class="grid"><select id="mp">${x.items.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+' — '+esc(p.position)+'</option>').join('')}</select><input id="mfy" value="2570" placeholder="ปีงบประมาณ"><input id="mm" placeholder="เดือน เช่น ตุลาคม"><input id="mno" type="number" min="1" max="12" placeholder="เลขเดือน 1-12"><input id="mr" type="number" placeholder="อัตรา/จำนวนเงิน"><label>วันที่ต้นเดือน<input id="ms" type="date"></label><label>วันที่สิ้นเดือน<input id="me" type="date"></label></div><textarea id="mnote" placeholder="หมายเหตุ"></textarea><button onclick="saveMonthly()">บันทึกรายการ ฉ.11</button></div>`}catch(e){alert(e.message)}}
async function saveMonthly(){try{const x=await api('/v1/monthly','POST',{personId:mp.value,fiscalYear:mfy.value,month:mm.value,monthNo:mno.value,rate:mr.value,amount:mr.value,startDate:ms.value,endDate:me.value,note:mnote.value});alert('สร้างรายการ '+x.id+' แล้ว');monthly()}catch(e){alert(e.message)}}
async function detail(id){try{const x=await api('/v1/claims/'+encodeURIComponent(id)),c=x.claim,p=x.person,name=[p['คำนำหน้า'],p['ชื่อ'],p['นามสกุล']].filter(Boolean).join(' ');app.innerHTML=nav()+`<div class="card"><div class="actions"><button onclick="downloadPdf('/v1/prints/form1/${esc(id)}',this)">สร้าง PDF แบบคำขอ</button><button onclick="claims()">กลับรายการคำขอ</button></div><h2>รายละเอียดคำขอ ${esc(id)}</h2><div class="notice">PDF จะสร้างจากแม่แบบ Google Sheets และดาวน์โหลดลงเครื่องโดยตรง</div><p><b>ผู้ขอ:</b> ${esc(name)}</p><p><b>ตำแหน่ง:</b> ${esc(p.ตำแหน่ง)} ${esc(p.ระดับ)}</p><p><b>หน่วยบริการ:</b> ${esc(p['หน่วยบริการปัจจุบัน'])}</p><p><b>ประเภท:</b> ${esc(c['ประเภทค่าตอบแทน'])}</p><p><b>งวด:</b> ${esc(c['เดือน'])} / ${esc(c['ปีงบประมาณ'])}</p><p><b>จำนวนเงิน:</b> ${Number(c['จำนวนเงิน']||0).toLocaleString('th-TH')} บาท</p><p><b>สถานะ:</b> ${esc(c.สถานะ)}</p></div>`}catch(e){alert(e.message)}}
async function downloadPdf(path,btn){const old=btn?btn.textContent:'';try{if(btn){btn.disabled=true;btn.textContent='กำลังสร้าง PDF...'}const x=await api(path,'POST',{});if(!x.dataBase64)throw Error('ไม่ได้รับข้อมูล PDF');const bin=atob(x.dataBase64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const url=URL.createObjectURL(new Blob([bytes],{type:x.mimeType||'application/pdf'})),a=document.createElement('a');a.href=url;a.download=x.fileName||'document.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){alert(e.message)}finally{if(btn){btn.disabled=false;btn.textContent=old}}}
function logout(){sessionStorage.removeItem('comp_token');token='';loginView()}token?home():loginView();
</script></body></html>
