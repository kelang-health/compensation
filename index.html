<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ระบบค่าตอบแทน</title><main><h1>ระบบจัดการค่าตอบแทน</h1><section id="login"><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">เข้าสู่ระบบ</button></section><pre id="out"></pre></main><script>const API='https://REPLACE-WORKER-URL';let t='';async function login(){let r=await fetch(API+'/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});let j=await r.json();if(!r.ok)return alert(j.message);t=j.token;let x=await fetch(API+'/v1/claims',{headers:{Authorization:'Bearer '+t}});out.textContent=JSON.stringify(await x.json(),null,2)}</script>
